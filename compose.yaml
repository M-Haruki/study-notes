services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ENV: production
      JWT_SECRET: ${JWT_SECRET:?required}
      DATABASE_URL: postgres://${POSTGRES_USER:?required}:${POSTGRES_PASSWORD:?required}@postgres:5432/${POSTGRES_DB:?required}?sslmode=disable
    ports:
      - "127.0.0.1:${APP_PORT:?required}:1323"
    depends_on:
      - postgres
    
  postgres:
    image: postgres:16-trixie
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?required}
      POSTGRES_USER: ${POSTGRES_USER:?required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
    volumes:
      - pgdata:/var/lib/postgresql/data
      
volumes:
  pgdata:
