services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /workspace
    volumes:
      - ..:/workspace:cached
      - f-node_modules:/workspace/frontend/node_modules
      - pgdata:/var/lib/postgresql/data
    command: sleep infinity
    environment:
      - NODE_ENV=development
      - POSTGRES_PASSWORD=pass
    stdin_open: true
    tty: true

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_PASSWORD=pass
      - POSTGRES_DB=notes
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
      
volumes:
  f-node_modules:
  pgdata:
